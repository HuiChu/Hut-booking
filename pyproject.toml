[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hut-booking-bot"
version = "0.1.0"
description = "Automation bot for Taiwan hut booking (hike.taiwan.gov.tw)"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40",
    "httpx[http2]>=0.27",
    "lxml>=5.0",
    "apscheduler>=3.10",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "typer>=0.12",
    "ntplib>=0.4",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
hut-bot = "hut_bot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20260518",
]
